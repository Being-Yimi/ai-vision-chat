<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 视觉对话</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h2>本地大模型 + YOLO 图像识别</h2>
        <div class="section">
            <h3>1. 上传图片检测</h3>
            <input type="file" id="imageInput" accept="image/*">
            <button onclick="analyzeImage()">上传并识别</button>
            <div><img id="resultImage" style="display:none;" /></div>
            <p id="imageDesc"></p>
        </div>
        <hr>
        <div class="section">
            <h3>2. 大模型对话</h3>
            <input id="prompt" type="text" placeholder="输入你的问题...">
            <button onclick="send()">发送</button>
            <p id="result"></p>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
