<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 视觉对话</title>
</head>
<body>
    <h2>本地大模型 + YOLO 图像识别</h2>
    
    <div>
        <h3>1. 上传图片检测</h3>
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="analyzeImage()">上传并识别</button>
        <p><img id="resultImage" style="max-width: 400px; display: none; border: 2px solid #ccc;" /></p>
        <p id="imageDesc" style="color: green; font-weight: bold;"></p>
    </div>

    <hr>

    <div>
        <h3>2. 大模型对话</h3>
        <input id="prompt" type="text" placeholder="输入你的问题..." style="width:300px;">
        <button onclick="send()">发送</button>
        <p id="result" style="color:blue;"></p>
    </div>

    <script>
        async function send() {
            const prompt = document.getElementById('prompt').value;
            const res = await fetch(`/api/chat?prompt=${encodeURIComponent(prompt)}`, {method: 'POST'});
            const data = await res.json();
            document.getElementById('result').innerText = data.reply;
        }

        async function analyzeImage() {
            const fileInput = document.getElementById('imageInput');
            if (fileInput.files.length === 0) {
                alert("请先选择一张图片！");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            const res = await fetch("/api/analyze", {
                method: "POST",
                body: formData
            });
            const data = await res.json();

            const img = document.getElementById('resultImage');
            img.src = data.image_url;
            img.style.display = 'block';

            document.getElementById('imageDesc').innerText = "AI 描述：" + data.description;
        }
    </script>
</body>
</html>
