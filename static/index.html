<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>本地大模型测试</title>
</head>
<body>
    <h2>本地 Ollama 对话测试</h2>
    <input id="prompt" type="text" placeholder="输入你的问题..." style="width:300px;">
    <button onclick="send()">发送</button>
    <p id="result" style="color:blue;"></p>

    <script>
        async function send() {
            const prompt = document.getElementById('prompt').value;
            const res = await fetch(`/api/chat?prompt=${encodeURIComponent(prompt)}`, {method: 'POST'});
            const data = await res.json();
            document.getElementById('result').innerText = data.reply;
        }
    </script>
</body>
</html>
